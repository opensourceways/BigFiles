[pytest]
minversion = 7.0
testpaths = scripts
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --cov=scripts
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-branch
norecursedirs = venv .venv .git .ai node_modules
